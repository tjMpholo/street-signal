server {
    listen 80;
    server_name street-signal.duetonetechsolutions.com;
    # Certificate issuance only: the application is not exposed over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/street-signal-acme;
    }
    location / {
        return 503 "Street Signal is being configured.\n";
    }
}

